name: Set up the workspace
description: >-
  pnpm, Node, optionally Bun, a frozen install, and — when the job runs turbo —
  the Turborepo cache restored from this branch or from main.

# One place for the toolchain versions. They were copied into six jobs across
# three workflows, which is how a Node bump lands in five of them.

inputs:
  bun:
    description: >-
      Install Bun as well. Only `apps/session-host` needs it — it embeds the
      agent SDK and runs its tests with `bun test` (decision 0005) — so only a
      job that reaches its `build`, `test` or `compile` asks for it.
    default: "false"

  turbo-cache:
    description: >-
      A name for this job's Turborepo cache. Empty means the job runs no turbo
      task and wants no cache.
    default: ""

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    # `cache: pnpm` caches the pnpm *store*, keyed off the lockfile, so the
    # install below is mostly hard-linking rather than downloading.
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm

    - if: inputs.bun == 'true'
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14

    - name: Install
      shell: bash
      run: pnpm install --frozen-lockfile

    # Turborepo's local cache. `<root>/.turbo/cache` is where turbo 2.x writes
    # it — measured on 2.10.8, not inferred from the version that documented
    # `node_modules/.cache/turbo`.
    #
    # Without this every job rebuilt every dependency of everything it touched,
    # because `typecheck` and `test` both `dependsOn: ["^build"]` and a fresh
    # runner has no `dist/` to skip.
    #
    # The key ends in the commit sha so each run publishes a fresh entry;
    # `restore-keys` is what produces the hits, most specific first: this job's
    # own last cache, then any job's on this branch or on `main`. GitHub scopes
    # caches to a branch plus its base, which is why the full run on `main`
    # (see `ci.yml`) is what keeps pull requests cheap — a pull request can read
    # `main`'s caches, but never another pull request's.
    - if: inputs.turbo-cache != ''
      uses: actions/cache@v4
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ inputs.turbo-cache }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ inputs.turbo-cache }}-
          turbo-${{ runner.os }}-
