name: CI

# The code checks. Nothing here runs unless the change could break it, decided on
# two axes:
#
# 1. **The trigger**, for the one axis that is genuinely file-shaped: documentation
#    cannot break a typecheck, a browser test or a Bun binary, so a change confined
#    to prose starts no runner at all. `checks.yml` holds what every change runs
#    (formatting, commit messages, history shape) and has no path filter; the split
#    is by workflow because `paths-ignore` is a trigger filter rather than a per-job
#    one.
#
# 2. **The dependency graph**, for everything else, which is where a path filter
#    would lie. `apps/session-host` has to be rebuilt by a change to
#    `packages/core`, and the e2e gate has to run for a change to `packages/ui`,
#    and no glob expresses "and its dependents". Turborepo already knows, so the
#    `scope` job below asks it (`turbo ls --affected`) and every other job is
#    gated on the answer. A gated job reports as *skipped*, which GitHub treats as
#    success for branch protection — so unlike a trigger filter, these can be
#    required checks.
#
# The `paths-ignore` filter is deliberately narrow, because a wrong "documentation"
# skips real checks: `docs/**`, root-level Markdown, `.omp/**`, and Markdown under
# `.github/`. **Markdown anywhere else is code.** Nothing under `apps/`, `packages/`
# or `scripts/` is read by a test or at runtime today — the one Markdown file there,
# `apps/server/src/plugins/test-fixtures/README.md`, describes fixtures that every
# loader resolves as `.ts` — and the point of the narrow axis is that it stays true
# without anyone re-checking: a fixture, a snapshot or a generated table under those
# trees is code the day it appears.
#
# `docs/**` is a directory rather than a genre, and it is about to hold executable
# files: #214 checks design exports, including JavaScript, in under `docs/design/`.
# Nothing lints those today either, so nothing is lost — but if `docs/` becomes a
# place code lives, this filter is what has to be revisited.
#
# **A push to `main` runs the whole graph, unfiltered.** Not belt-and-braces: a
# GitHub cache is readable from the branch that wrote it and from branches based on
# it, so every pull request restores `main`'s Turborepo cache and none can restore
# another's. A `--affected` run on `main` would only ever publish the packages that
# happened to change, leaving every other package cold for every pull request that
# touches it. The full run per merge is what buys the cache hits.

on:
  push:
    branches: [main]
    # One list, aliased below: Actions supports YAML anchors (merge keys, `<<:`, are
    # the part it still does not), and the classification is the one rule here that
    # must not drift between the two triggers.
    paths-ignore: &documentation
      - "docs/**"
      - "*.md"
      - ".omp/**"
      - ".github/**/*.md"
  pull_request:
    paths-ignore: *documentation

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What `e2e` and `session-host-binary` are gated on, and how `code` is scoped.
  # Cheap — an install and one turbo query — and its own job rather than a step of
  # `code`, so those two still start in parallel with the checks instead of
  # queueing behind them.
  scope:
    name: Decide what to run
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.decide.outputs.packages }}
      turbo-scope: ${{ steps.decide.outputs.turbo-scope }}
      web: ${{ steps.decide.outputs.web }}
      session-host: ${{ steps.decide.outputs.session-host }}
    steps:
      - uses: actions/checkout@v4
        with:
          # `--affected` diffs against the base commit, which a shallow clone
          # does not have.
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail

          # The diff is captured before anything is matched against it, rather than
          # piped into `grep -q`: under `pipefail`, `grep -q` exits on the first
          # match, `git` then dies of SIGPIPE, and the pipeline reports 141 — so a
          # matched path would read as no match, on exactly the large diffs where
          # it matters.
          #
          # On a pull request, `github.sha` is the merge commit Actions checked
          # out, so `base..HEAD` is exactly this branch's diff.
          changed=
          if [ "$EVENT" = "pull_request" ]; then
            changed=$(git diff --name-only "$BASE" "$HEAD")
          fi

          matches() { grep -qE "$1" <<<"$changed"; }

          # Two ways to end up unscoped.
          #
          # A push to `main` runs the whole graph to publish a cache every pull
          # request can restore (see this file's header).
          #
          # So does a change to what is installed, or to which packages exist.
          # Turbo reads `pnpm-lock.yaml` semantically, and on a *coherent* bump it
          # is precise — rewriting better-sqlite3's version throughout selected
          # `db` and its three dependents, and changed `@plotroom/db#lint`'s task
          # hash and no other. But an edit it cannot resolve selects **nothing**
          # (measured on 2.10.8: changing only the importer's version selected no
          # package at all), and a dependency bump is not a change to be wrong
          # about in that direction. Root `package.json` is here for a plainer
          # reason: it pins TypeScript, ESLint and Vitest for every package.
          #
          # Unfiltered is not the same as uncached, which is what makes this cheap
          # rather than a full rebuild: turbo's *hashing* of the lockfile stays
          # precise even where its selection is not, so the packages a bump did not
          # reach replay from cache.
          if [ "$EVENT" != "pull_request" ] ||
            matches '^(pnpm-lock\.yaml|pnpm-workspace\.yaml|package\.json|\.npmrc)$'; then
            scope=
          else
            export TURBO_SCM_BASE="$BASE" TURBO_SCM_HEAD="$HEAD"
            scope=--affected
          fi

          packages=$(pnpm exec turbo ls $scope --output=json | node -e '
            let json = "";
            process.stdin
              .on("data", (chunk) => (json += chunk))
              .on("end", () => {
                const { packages } = JSON.parse(json);
                console.log(packages.items.map((p) => p.name).join(" "));
              });
          ')

          affects() { case " $packages " in (*" $1 "*) return 0 ;; (*) return 1 ;; esac; }

          {
            echo "packages=$packages"
            echo "turbo-scope=$scope"
            if affects @plotroom/web; then echo "web=true"; else echo "web=false"; fi
            if affects @plotroom/session-host; then
              echo "session-host=true"
            else
              echo "session-host=false"
            fi
          } >> "$GITHUB_OUTPUT"

          # Say what was decided where a human will look, so a skipped job is
          # never a mystery.
          {
            if [ -n "$scope" ]; then
              echo "### Affected packages"
              echo
              echo "\`$BASE\` → \`$HEAD\`"
            else
              echo "### Every package"
              echo
              echo "A push to \`main\` runs the whole graph and publishes its cache."
            fi
            echo
            if [ -z "$packages" ]; then
              echo "_none_"
            else
              for package in $packages; do echo "- \`$package\`"; done
            fi
            echo
            echo "| Job | Runs |"
            echo "| --- | --- |"
            echo "| e2e | $(if affects @plotroom/web; then echo yes; else echo no; fi) |"
            echo "| session-host-binary | $(if affects @plotroom/session-host; then echo yes; else echo no; fi) |"
          } >> "$GITHUB_STEP_SUMMARY"

  code:
    name: Typecheck, lint and test
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          # `apps/session-host` runs its tests with `bun test` (decision 0005).
          bun: "true"
          turbo-cache: code

      # One turbo invocation rather than three, so lint (which depends on no
      # build) runs while the builds typecheck and test need are still going.
      # `$SCOPE` is `--affected` or empty, and unquoted so that empty passes no
      # argument at all. With nothing affected turbo runs nothing and exits — no
      # `if:` needed, and none that could go stale.
      - name: Typecheck, lint and test
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
          TURBO_SCM_HEAD: ${{ github.sha }}
          SCOPE: ${{ needs.scope.outputs.turbo-scope }}
        run: pnpm check $SCOPE

      # `scripts/**` is repository tooling rather than a workspace package, so
      # turbo cannot answer for it — and it is deliberately not gated either.
      # `pnpm check:scripts` takes four seconds inside a job that is running
      # anyway, and the path list that would skip it was already wrong: its
      # `workspace-tooling.test.ts` reads every package's manifest, tsconfig and
      # vitest configuration (#215), so the surface is most of the repository.
      # Four seconds is not worth a regex re-derived every time a package grows a
      # config file.
      #
      # And it is worth the four seconds: the release script decides what version
      # the product claims to be (#94), and that test is what keeps every
      # package's build tooling honest. "Outside the build graph" is a bad reason
      # for either to be what CI never checks.
      - name: Check the tooling
        run: pnpm check:scripts

  # The W10 milestone gate: a spawned `@plotroom/server`, a real git repository
  # and a Chromium tab against the server's own served page. It runs when
  # `@plotroom/web` is affected, which — since web depends on server, which
  # depends on core, db, the plugins and session-host — is nearly every change to
  # anything the gate actually exercises, and none of the changes it does not
  # (`apps/desktop`, `scripts/`).
  e2e:
    name: E2E (W10 milestone gate)
    needs: scope
    if: needs.scope.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          # No Bun. The build below reaches `apps/session-host` (the server
          # depends on it), but its `build` is `tsc -b` — only its `test` and
          # `compile` need Bun, and this job runs neither.
          turbo-cache: e2e

      # `--filter=@plotroom/web` and not `pnpm build`: the gate serves
      # `apps/web/dist` and spawns `apps/server/dist/index.js`, and web's build
      # `dependsOn: ["^build"]` pulls the server and everything under it along.
      # `apps/desktop` is the only package that drops out, and nothing here
      # loads it.
      - name: Build what the gate serves
        run: pnpm exec turbo run build --filter=@plotroom/web

      # ~150MB of Chromium per run otherwise. Keyed on the lockfile because that
      # is what pins the Playwright version the browser has to match.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright's Chromium
        run: pnpm --filter @plotroom/web exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm --filter @plotroom/web e2e

      # What a failed test already wrote, kept: `playwright.config.ts` sets
      # `trace: "retain-on-failure"`, so each failure leaves a trace (network
      # log, console, DOM snapshots, screencast) and an `error-context.md` with
      # the page's accessibility snapshot — the browser side of the run, not the
      # spawned server's, whose output the harness discards and whose state
      # directory it removes (#227). Without this it died with the runner and
      # what reached a human was the assertion alone.
      #
      # **Download it before pressing "re-run".** GitHub keeps artifacts for a
      # run's latest attempt only, so a re-run — this team's habitual response to
      # a flake — is what destroys the first occurrence's evidence.
      #
      # Deliberately not `retries`. Playwright stays at `retries: 0`: a retry
      # turns a flake into a green check with a note nobody reads, and the point
      # is to make a failure explicable, not to make it disappear.
      - name: Keep what the failure left behind
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: apps/web/test-results/
          retention-days: 14
          # Left at the default `warn`: when `failure()` fires from an earlier
          # step there is nothing to keep, and saying so is the one fact a reader
          # of that log wants.

  # The packaged session host is one compiled binary per platform (issue #92):
  # `bun build --compile` plus the SDK's native addon staged beside it, which
  # `pnpm compile` produces and then runs. Bun can cross-compile, but the addon
  # cannot be had for a platform this runner did not install, so this is a matrix
  # of native runners rather than one job with three targets — the same
  # constraint the installer build carries (#79).
  #
  # Nothing is uploaded: no release consumes an artifact from a PR run, and the
  # job's claim is that the binary builds and starts on each platform, which the
  # compile's own smoke test makes. Release wiring is #79/#94's.
  #
  # Three platforms, not five: `macos-latest` is arm64 and `ubuntu-latest` x64,
  # so a green run says nothing about `darwin-x64` or `linux-arm64`, both of
  # which the SDK publishes an addon for. Adding `macos-13` and
  # `ubuntu-24.04-arm` is what would cover them; until then the gap is stated
  # rather than implied by a green check.
  session-host-binary:
    name: Session host binary (${{ matrix.os }})
    needs: scope
    # Three runners, two of them the expensive kind, for a package most changes
    # do not touch. `packages/core` does touch it, and `--affected` knows that.
    if: needs.scope.outputs.session-host == 'true'
    # The failure this job exists to catch includes a binary that hangs at module
    # init; without a bound that burns the default six hours on a runner.
    timeout-minutes: 20
    strategy:
      # One platform failing must not hide the others: which of them can produce
      # the binary is the whole question here.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # A plain install, scripts and all. This used `--ignore-scripts` because a
      # full install failed on the Windows runner (#183); nothing compiles on
      # any platform now, so the flag would only be hiding whether that is
      # still true.
      #
      # `compile` itself is `cache: false` — it ends by running what it built —
      # but it `dependsOn: ["^build"]`, and those builds cache.
      - uses: ./.github/actions/setup
        with:
          bun: "true"
          turbo-cache: session-host

      - name: Compile the session host, and run what it built
        run: pnpm compile
