name: CI

# The code checks. Documentation cannot break a typecheck, a browser test or a Bun
# binary, so a change confined to prose does not run any of them — a docs-only pull
# request was compiling on three platforms to prove that prose still built.
#
# `checks.yml` holds what every change runs (formatting, commit messages, history
# shape) and has no path filter. The split is by workflow because `paths-ignore` is a
# trigger filter rather than a per-job one.
#
# The filter is deliberately narrow, because a wrong "documentation" skips real checks:
# `docs/**`, root-level Markdown, `.omp/**`, and Markdown under `.github/`. **Markdown
# anywhere else is code.** Nothing under `apps/`, `packages/` or `scripts/` is read by a
# test or at runtime today — the one Markdown file there,
# `apps/server/src/plugins/test-fixtures/README.md`, describes fixtures that every
# loader resolves as `.ts` — and the point of the narrow axis is that it stays true
# without anyone re-checking: a fixture, a snapshot or a generated table under those
# trees is code the day it appears.
#
# `docs/**` is a directory rather than a genre, and it is about to hold executable
# files: #214 checks design exports, including JavaScript, in under `docs/design/`.
# Nothing lints those today either, so nothing is lost — but if `docs/` becomes a place
# code lives, this filter is what has to be revisited.
#
# A skipped job reports neither success nor failure, so if branch protection is ever
# enabled here, only `checks.yml`'s jobs can be *required* checks.

on:
  push:
    branches: [main]
    # One list, aliased below: Actions supports YAML anchors (merge keys, `<<:`, are
    # the part it still does not), and the classification is the one rule here that
    # must not drift between the two triggers.
    paths-ignore: &documentation
      - "docs/**"
      - "*.md"
      - ".omp/**"
      - ".github/**/*.md"
  pull_request:
    paths-ignore: *documentation

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # One package needs Bun: `apps/session-host` embeds the agent SDK, which is
      # Bun-only, and runs its tests with `bun test` (decision 0005). A toolchain
      # addition, not a replacement — pnpm still installs, turbo still runs
      # everything, and every other package stays on Node. Producing the packaged
      # compiled binary is #93's half of this.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: pnpm install --frozen-lockfile

      # Formatting is `checks.yml`'s: it is the one check a documentation-only change
      # can fail, so it cannot live behind this workflow's path filter.

      # `scripts/**` is repository tooling, not a workspace package, so turbo
      # does not reach it and the `:scripts` passes are separate steps rather
      # than chained onto the turbo ones — chaining them into one script would
      # have sent `pnpm typecheck --filter …`'s arguments to the tail command
      # instead of to turbo. The release script decides what version the
      # product claims to be (#94); "outside the build graph" is a bad reason
      # for it to be the one file CI never checks.
      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck (tooling)
        run: pnpm typecheck:scripts

      - name: Lint
        run: pnpm lint

      - name: Lint (tooling)
        run: pnpm lint:scripts

      - name: Test
        run: pnpm test

      - name: Test (tooling)
        run: pnpm test:scripts

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # `pnpm build` reaches `apps/session-host`'s `tsc -b`.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm --filter @plotroom/web exec playwright install --with-deps chromium

      - name: E2E (W10 milestone gate)
        run: pnpm --filter @plotroom/web e2e

  # The packaged session host is one compiled binary per platform (issue #92):
  # `bun build --compile` plus the SDK's native addon staged beside it, which
  # `pnpm compile` produces and then runs. Bun can cross-compile, but the addon
  # cannot be had for a platform this runner did not install, so this is a matrix
  # of native runners rather than one job with three targets — the same
  # constraint the installer build carries (#79).
  #
  # Nothing is uploaded: no release consumes an artifact from a PR run, and the
  # job's claim is that the binary builds and starts on each platform, which the
  # compile's own smoke test makes. Release wiring is #79/#94's.
  #
  # Three platforms, not five: `macos-latest` is arm64 and `ubuntu-latest` x64,
  # so a green run says nothing about `darwin-x64` or `linux-arm64`, both of
  # which the SDK publishes an addon for. Adding `macos-13` and
  # `ubuntu-24.04-arm` is what would cover them; until then the gap is stated
  # rather than implied by a green check.
  session-host-binary:
    # The failure this job exists to catch includes a binary that hangs at module
    # init; without a bound that burns the default six hours on a runner.
    timeout-minutes: 20
    strategy:
      # One platform failing must not hide the others: which of them can produce
      # the binary is the whole question here.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # A plain install, scripts and all. This used `--ignore-scripts` because a
      # full install failed on the Windows runner (#183); nothing compiles on
      # any platform now, so the flag would only be hiding whether that is
      # still true.
      - run: pnpm install --frozen-lockfile

      - name: Compile the session host, and run what it built
        run: pnpm compile

  # A full `pnpm install --frozen-lockfile` **with scripts**, on Windows,
  # followed by a round trip through the SQLite binding it installs (#183).
  #
  # Windows is the only platform where this can regress, and it regressed
  # silently: `better-sqlite3` carries a `binding.gyp` at its package root, so
  # pnpm synthesises the default `install: node-gyp rebuild` for it even though
  # it ships an N-API prebuild per platform and needs no compiler — and
  # node-gyp 10.2.0 does not recognise the Visual Studio the runner image now
  # ships ("unknown version \"undefined\" found at .../Visual Studio\\18"). The
  # fix is `pnpm.neverBuiltDependencies`, and the thing that keeps it fixed is
  # this job: without it, the next dependency that wants a compiler is found by
  # whoever tries to build the Windows installer (#79), not by CI.
  #
  # The last step exercises the binding rather than running `@plotroom/db`'s
  # suite. That was the first shape of this job and it failed — for reasons
  # that have nothing to do with installing: 21 of its tests tear down with
  # `EBUSY: resource busy or locked, unlink ...\plotroom.db`, because Windows
  # refuses to delete a file that still has an open handle and `afterEach`
  # removes the state directory straight after `close()`. Filed as #202.
  # Running it here would have made this job's red mean two unrelated things,
  # and the one it exists to catch is the install.
  windows-install:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The install step *is* the regression test. Without
      # `neverBuiltDependencies`, pnpm synthesises `install: node-gyp rebuild`
      # for better-sqlite3 and this step is what fails on a Windows runner,
      # exactly as it did in #183's original log.
      - name: Install with scripts
        run: pnpm install --frozen-lockfile

      # What can be asserted on top of that, and what cannot. "Did pnpm run a
      # build?" is **not** reliably observable after the fact: pnpm's
      # side-effects cache replays a build performed by an earlier install, so
      # a warm store neither runs the script nor prints that it did (measured
      # both ways locally), and `binding.gyp` degrades its targets to
      # `type: none` when a prebuild matches the host, so even a real node-gyp
      # run emits only `.stamp` files. A guard on any of those passes when it
      # should fail.
      #
      # What is observable, and is the claim a Windows installer actually
      # rests on, is *which binary loads*: `lib/binding.js` prefers
      # `build/Release/better_sqlite3.node` and falls back to `prebuilds/`. If
      # a compile ever succeeds here, the first exists and this fails.
      - name: Refuse a compiled binding
        shell: bash
        run: |
          pkg=$(echo node_modules/.pnpm/better-sqlite3@*/node_modules/better-sqlite3)
          test -d "$pkg" || { echo "better-sqlite3 not found at $pkg"; exit 1; }
          test -f "$pkg/prebuilds/win32-x64.node" || {
            echo "no win32-x64 prebuild shipped; this platform would need a compiler"
            exit 1
          }
          if [ -f "$pkg/build/Release/better_sqlite3.node" ]; then
            echo "a compiled binding exists and would load in preference to the prebuild"
            exit 1
          fi
          echo "the shipped prebuild is what will load"

      # A round trip through the native module, which is the whole claim: the
      # server's SQLite is what a Windows installer has to ship, and an
      # install that "succeeded" without a loadable binding proves nothing.
      # Run from `packages/db`, where `better-sqlite3` is actually a
      # dependency — pnpm's store is not hoisted to the root.
      - name: Load the SQLite binding and round-trip a row
        working-directory: packages/db
        run: >-
          node -e "const D=require('better-sqlite3');
          const d=new D(':memory:');
          d.exec('create table t (x integer)');
          d.prepare('insert into t values (?)').run(42);
          const got=d.prepare('select x from t').get().x;
          if (got !== 42) { throw new Error('round trip returned ' + got); }
          console.log('sqlite ok via', require.resolve('better-sqlite3'));"
