name: CI

# The code checks. Nothing here runs unless the change could break it, decided on
# two axes:
#
# 1. **The trigger**, for the one axis that is genuinely file-shaped: documentation
#    cannot break a typecheck, a browser test or a Bun binary, so a change confined
#    to prose starts no runner at all. `checks.yml` holds what every change runs
#    (formatting, commit messages, history shape) and has no path filter; the split
#    is by workflow because `paths-ignore` is a trigger filter rather than a per-job
#    one.
#
# 2. **The dependency graph**, for everything else, which is where a path filter
#    would lie. `apps/session-host` has to be rebuilt by a change to
#    `packages/core`, and the e2e gate has to run for a change to `packages/ui`,
#    and no glob expresses "and its dependents". Turborepo already knows, so the
#    `scope` job below asks it (`turbo ls --affected`) and every other job is
#    gated on the answer. A gated job reports as *skipped*, which GitHub treats as
#    success for branch protection — so unlike a trigger filter, these can be
#    required checks.
#
# The `paths-ignore` filter is deliberately narrow, because a wrong "documentation"
# skips real checks: `docs/**`, root-level Markdown, `.omp/**`, and Markdown under
# `.github/`. **Markdown anywhere else is code.** Nothing under `apps/`, `packages/`
# or `scripts/` is read by a test or at runtime today — the one Markdown file there,
# `apps/server/src/plugins/test-fixtures/README.md`, describes fixtures that every
# loader resolves as `.ts` — and the point of the narrow axis is that it stays true
# without anyone re-checking: a fixture, a snapshot or a generated table under those
# trees is code the day it appears.
#
# `docs/**` is a directory rather than a genre, and it is about to hold executable
# files: #214 checks design exports, including JavaScript, in under `docs/design/`.
# Nothing lints those today either, so nothing is lost — but if `docs/` becomes a
# place code lives, this filter is what has to be revisited.
#
# **A push to `main` runs the whole graph, unfiltered.** Not belt-and-braces: a
# GitHub cache is readable from the branch that wrote it and from branches based on
# it, so every pull request restores `main`'s Turborepo cache and none can restore
# another's. A `--affected` run on `main` would only ever publish the packages that
# happened to change, leaving every other package cold for every pull request that
# touches it. The full run per merge is what buys the cache hits.

on:
  push:
    branches: [main]
    # One list, aliased below: Actions supports YAML anchors (merge keys, `<<:`, are
    # the part it still does not), and the classification is the one rule here that
    # must not drift between the two triggers.
    paths-ignore: &documentation
      - "docs/**"
      - "*.md"
      - ".omp/**"
      - ".github/**/*.md"
  pull_request:
    paths-ignore: *documentation
  # #317: `webkit`/`firefox` (`e2e-browser-matrix`, below) run here and on
  # every push to `main` — never per-PR, so growing the browser matrix never
  # costs a pull request anything. Off-peak UTC, arbitrary minute past the
  # hour to avoid GitHub's documented top-of-hour scheduling congestion.
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What `e2e` and `session-host-binary` are gated on, and how `code` is scoped.
  # Cheap — an install and one turbo query — and its own job rather than a step of
  # `code`, so those two still start in parallel with the checks instead of
  # queueing behind them.
  scope:
    name: Decide what to run
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.decide.outputs.packages }}
      turbo-scope: ${{ steps.decide.outputs.turbo-scope }}
      web: ${{ steps.decide.outputs.web }}
      session-host: ${{ steps.decide.outputs.session-host }}
      desktop: ${{ steps.decide.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
        with:
          # `--affected` diffs against the base commit, which a shallow clone
          # does not have.
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail

          # The diff is captured before anything is matched against it, rather than
          # piped into `grep -q`: under `pipefail`, `grep -q` exits on the first
          # match, `git` then dies of SIGPIPE, and the pipeline reports 141 — so a
          # matched path would read as no match, on exactly the large diffs where
          # it matters.
          #
          # On a pull request, `github.sha` is the merge commit Actions checked
          # out, so `base..HEAD` is exactly this branch's diff.
          changed=
          if [ "$EVENT" = "pull_request" ]; then
            changed=$(git diff --name-only "$BASE" "$HEAD")
          fi

          matches() { grep -qE "$1" <<<"$changed"; }

          # Two ways to end up unscoped.
          #
          # A push to `main` runs the whole graph to publish a cache every pull
          # request can restore (see this file's header).
          #
          # So does a change to what is installed, or to which packages exist.
          # Turbo reads `bun-lock.yaml` semantically, and on a *coherent* bump it
          # is precise — rewriting better-sqlite3's version throughout selected
          # `db` and its three dependents, and changed `@plotroom/db#lint`'s task
          # hash and no other. But an edit it cannot resolve selects **nothing**
          # (measured on 2.10.8: changing only the importer's version selected no
          # package at all), and a dependency bump is not a change to be wrong
          # about in that direction. Root `package.json` is here for a plainer
          # reason: it pins TypeScript, ESLint and Vitest for every package.
          #
          # Unfiltered is not the same as uncached, which is what makes this cheap
          # rather than a full rebuild: turbo's *hashing* of the lockfile stays
          # precise even where its selection is not, so the packages a bump did not
          # reach replay from cache.
          if [ "$EVENT" != "pull_request" ] ||
            matches '^(bun-lock\.yaml|bun-workspace\.yaml|package\.json|\.npmrc)$'; then
            scope=
          else
            export TURBO_SCM_BASE="$BASE" TURBO_SCM_HEAD="$HEAD"
            scope=--affected
          fi

          packages=$(bunx turbo ls $scope --output=json | node -e '
            let json = "";
            process.stdin
              .on("data", (chunk) => (json += chunk))
              .on("end", () => {
                const { packages } = JSON.parse(json);
                console.log(packages.items.map((p) => p.name).join(" "));
              });
          ')

          affects() { case " $packages " in (*" $1 "*) return 0 ;; (*) return 1 ;; esac; }

          {
            echo "packages=$packages"
            echo "turbo-scope=$scope"
            if affects @plotroom/web; then echo "web=true"; else echo "web=false"; fi
            if affects @plotroom/session-host; then
              echo "session-host=true"
            else
              echo "session-host=false"
            fi
            if affects @plotroom/desktop; then
              echo "desktop=true"
            else
              echo "desktop=false"
            fi
          } >> "$GITHUB_OUTPUT"

          # Say what was decided where a human will look, so a skipped job is
          # never a mystery.
          {
            if [ -n "$scope" ]; then
              echo "### Affected packages"
              echo
              echo "\`$BASE\` → \`$HEAD\`"
            else
              echo "### Every package"
              echo
              echo "A push to \`main\` runs the whole graph and publishes its cache."
            fi
            echo
            if [ -z "$packages" ]; then
              echo "_none_"
            else
              for package in $packages; do echo "- \`$package\`"; done
            fi
            echo
            echo "| Job | Runs |"
            echo "| --- | --- |"
            echo "| e2e | $(if affects @plotroom/web; then echo yes; else echo no; fi) |"
            echo "| session-host-binary | $(if affects @plotroom/session-host; then echo yes; else echo no; fi) |"
            echo "| desktop-package | $(if affects @plotroom/desktop; then echo yes; else echo no; fi) |"
          } >> "$GITHUB_STEP_SUMMARY"

  code:
    name: Typecheck, lint and test
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # #316: `apps/desktop`'s `test` (`cd src-tauri && cargo test`) is part
      # of the same `turbo run ... test` this job invokes below, and
      # compiling the `tauri` crate on Linux links against WebKitGTK at
      # *build* time, not only at bundle time — `ubuntu-latest` does not ship
      # these headers, unlike its preinstalled Rust toolchain, which does not
      # need a separate setup step.
      - name: Install Tauri's Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - uses: ./.github/actions/setup
        with:
          # `apps/session-host` runs its tests with `bun test` (decision 0005).
          bun: "true"
          turbo-cache: code

      # One turbo invocation rather than three, so lint (which depends on no
      # build) runs while the builds typecheck and test need are still going.
      # `$SCOPE` is `--affected` or empty, and unquoted so that empty passes no
      # argument at all. With nothing affected turbo runs nothing and exits — no
      # `if:` needed, and none that could go stale.
      - name: Typecheck, lint and test
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
          TURBO_SCM_HEAD: ${{ github.sha }}
          SCOPE: ${{ needs.scope.outputs.turbo-scope }}
        run: bun check $SCOPE

      # `scripts/**` is repository tooling rather than a workspace package, so
      # turbo cannot answer for it — and it is deliberately not gated either.
      # `bun check:scripts` takes four seconds inside a job that is running
      # anyway, and the path list that would skip it was already wrong: its
      # `workspace-tooling.test.ts` reads every package's manifest, tsconfig and
      # vitest configuration (#215), so the surface is most of the repository.
      # Four seconds is not worth a regex re-derived every time a package grows a
      # config file.
      #
      # And it is worth the four seconds: the release script decides what version
      # the product claims to be (#94), and that test is what keeps every
      # package's build tooling honest. "Outside the build graph" is a bad reason
      # for either to be what CI never checks.
      - name: Check the tooling
        run: bun check:scripts

  # The W10 milestone gate: a spawned `@plotroom/server`, a real git repository
  # and a Chromium tab against the server's own served page. It runs when
  # `@plotroom/web` is affected, which — since web depends on server, which
  # depends on core, db, the plugins and session-host — is nearly every change to
  # anything the gate actually exercises, and none of the changes it does not
  # (`apps/desktop`, `scripts/`).
  e2e:
    name: E2E (W10 milestone gate)
    needs: scope
    if: needs.scope.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          # No Bun. The build below reaches `apps/session-host` (the server
          # depends on it), but its `build` is `tsc -b` — only its `test` and
          # `compile` need Bun, and this job runs neither.
          turbo-cache: e2e

      # `--filter=@plotroom/web` and not `bun build`: the gate serves
      # `apps/web/dist` and spawns `apps/server/dist/index.js`, and web's build
      # `dependsOn: ["^build"]` pulls the server and everything under it along.
      # `apps/desktop` is the only package that drops out, and nothing here
      # loads it.
      - name: Build what the gate serves
        run: bunx turbo run build --filter=@plotroom/web

      # ~150MB of Chromium per run otherwise. Keyed on the lockfile because that
      # is what pins the Playwright version the browser has to match.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright's Chromium
        run: bunx playwright install --with-deps chromium

      - name: E2E
        run: bun run --filter=@plotroom/web e2e

      # What a failed test already wrote, kept: `playwright.config.ts` sets
      # `trace: "retain-on-failure"`, so each failure leaves a trace (network
      # log, console, DOM snapshots, screencast) — the browser side of the
      # run. `server-harness.ts`'s `startMilestoneServer` (#227) now covers
      # the server side the same way: on a test failure it copies the
      # spawned server's captured stdout/stderr and `plotroom.db` into
      # `apps/web/test-results/server-debug/` before deleting its scratch
      # state dir, so this same upload picks that up too, unprompted.
      #
      # **Download it before pressing "re-run".** GitHub keeps artifacts for a
      # run's latest attempt only, so a re-run — this team's habitual response to
      # a flake — is what destroys the first occurrence's evidence.
      #
      # Deliberately not `retries`. Playwright stays at `retries: 0`: a retry
      # turns a flake into a green check with a note nobody reads, and the point
      # is to make a failure explicable, not to make it disappear.
      - name: Keep what the failure left behind
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: apps/web/test-results/
          retention-days: 14
          # Left at the default `warn`: when `failure()` fires from an earlier
          # step there is nothing to keep, and saying so is the one fact a reader
          # of that log wants.

  # #317: the browser engine matrix's other two legs. `chromium` (the `e2e`
  # job above) is the per-PR gate and stays exactly as it was — this job
  # never runs on `pull_request`, so growing the matrix costs a pull request
  # nothing. `webkit` and `firefox` run here instead, on every push to
  # `main` and nightly (this file's own `schedule` trigger). Same hermetic
  # spawned-server harness as `e2e`, just the other two `playwright.config.ts`
  # projects (see that file's own comment on why `webkit` is a standards
  # proxy, not WebKitGTK/WKWebView identity — closing that gap is
  # `desktop-package`'s native shell suite, below).
  e2e-browser-matrix:
    name: E2E browser matrix (webkit, firefox)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # #359: this job is non-blocking *as a whole* while its stability is
    # unproven -- webkit/firefox never ran per-PR before this job existed
    # (ADR §5), so neither engine had a track record before becoming a gate,
    # and the result was `main` red on unrelated changes (#347, #357, #358).
    # It still runs on every push-to-main and nightly (this file's own
    # `schedule` trigger, above), and still reports: a failing step here does
    # not fail the workflow, but the job shows its real per-step result and
    # the artifact step below still uploads traces (see its own comment).
    # Promotion bar, recorded on #359: 10 consecutive green nightly runs.
    # Remove this line once that bar is met and #359 is resolved.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          turbo-cache: e2e

      - name: Build what the gate serves
        run: bunx turbo run build --filter=@plotroom/web

      # A separate cache key from `e2e`'s own: that job's key already
      # resolves under the same lockfile hash and caches only `chromium`,
      # so sharing one key here would mean whichever job's `actions/cache`
      # save lands first wins and the other's browsers (`webkit`/`firefox`
      # here, `chromium` there) never get cached at all.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('bun-lock.yaml') }}
          restore-keys: playwright-browsers-${{ runner.os }}-

      - name: Install Playwright's WebKit and Firefox
        run: bunx playwright install --with-deps webkit firefox

      - name: E2E (webkit, firefox)
        run: bun run --filter=@plotroom/web e2e:browsers

      # Same reasoning as `e2e`'s own artifact step above. `failure()` here
      # reads this job's own step outcomes, unaffected by the job-level
      # `continue-on-error` above (#359): that flag only changes how the
      # *job's* conclusion is reported to the workflow/required-checks, not
      # whether an earlier step in this same job counts as failed -- so a
      # failing `E2E (webkit, firefox)` step still trips this upload.
      - name: Keep what the failure left behind
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-browser-matrix-failure
          path: apps/web/test-results/
          retention-days: 14

  # The packaged session host is one compiled binary per platform (issue #92):
  # `bun build --compile` plus the SDK's native addon staged beside it, which
  # `bun compile` produces and then runs. Bun can cross-compile, but the addon
  # cannot be had for a platform this runner did not install, so this is a matrix
  # of native runners rather than one job with three targets — the same
  # constraint the installer build carries (#79).
  #
  # Nothing is uploaded: no release consumes an artifact from a PR run, and the
  # job's claim is that the binary builds and starts on each platform, which the
  # compile's own smoke test makes. Release wiring is #79/#94's.
  #
  # All five platforms the SDK publishes a native addon for get a runner:
  # `macos-latest` (darwin-arm64), `macos-15-intel` (darwin-x64, GitHub's
  # recommended Intel-mac successor — `macos-13` was retired in December
  # 2025), `ubuntu-latest` (linux-x64), `ubuntu-24.04-arm` (linux-arm64) and
  # `windows-latest` (win32-x64).
  session-host-binary:
    name: Session host binary (${{ matrix.os }})
    needs: scope
    # Three runners, two of them the expensive kind, for a package most changes
    # do not touch. `packages/core` does touch it, and `--affected` knows that.
    if: needs.scope.outputs.session-host == 'true'
    # The failure this job exists to catch includes a binary that hangs at module
    # init; without a bound that burns the default six hours on a runner.
    timeout-minutes: 20
    strategy:
      # One platform failing must not hide the others: which of them can produce
      # the binary is the whole question here.
      fail-fast: false
      matrix:
        os:
          [
            ubuntu-latest,
            ubuntu-24.04-arm,
            macos-latest,
            macos-15-intel,
            windows-latest,
          ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # A plain install, scripts and all. This used `--ignore-scripts` because a
      # full install failed on the Windows runner (#183); nothing compiles on
      # any platform now, so the flag would only be hiding whether that is
      # still true.
      #
      # `compile` itself is `cache: false` — it ends by running what it built —
      # but it `dependsOn: ["^build"]`, and those builds cache.
      - uses: ./.github/actions/setup
        with:
          bun: "true"
          turbo-cache: session-host

      - name: Compile the session host, and run what it built
        run: bun compile

  # #316: the packaged desktop app, native-runner matrix, reusing
  # `session-host-binary`'s pattern above (one native runner per OS, because
  # neither the session-host addon nor a Tauri bundle can be produced for a
  # platform the runner is not). `macos-15-intel` is Intel
  # (`x86_64-apple-darwin`); `macos-latest` is Apple Silicon
  # (`aarch64-apple-darwin`) — the ADR's "bundler config including Intel mac"
  # is this row (`macos-13` was retired by GitHub in December 2025 and was
  # replaced here with its recommended Intel successor), config-only until a
  # real Intel runner exercises it (unverified on the Linux container #316's
  # own PR was built on; see that PR for what is and is not proven there).
  #
  # Nothing is uploaded, same reasoning as `session-host-binary`: no release
  # consumes a PR artifact, and this job's claim is "the bundle builds and
  # the updater dry-run succeeds against a placeholder host" (per #316's
  # acceptance), not a distributable. Signing is explicitly out of scope
  # (#309's ADR §6, deferred) — every platform's bundle ships unsigned here.
  desktop-package:
    name: Desktop package (${{ matrix.os }})
    needs: scope
    if: needs.scope.outputs.desktop == 'true'
    # #317 added a debug `cargo build` plus the native shell suite on top
    # of packaging, and `macos-15-intel` was already the tightest row
    # before that: #319 measured it at ~1598s (~26.6min) for packaging
    # alone, most of it `cargo install tauri-cli` compiling from source
    # (tracked to get fast by #350). 60 is real headroom over that
    # baseline rather than a number picked to make one slow row pass --
    # the fix for the slow row is #350, not dropping its native-shell
    # coverage or padding this cap indefinitely.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          bun: "true"
          turbo-cache: desktop

      # GitHub-hosted runners ship a Rust toolchain already; only Linux's
      # WebKitGTK/GTK3 system libraries (Tauri's Linux webview + tray/AppIndicator
      # dependencies) are not preinstalled. `libfuse2`: the appimage bundle
      # target runs `linuxdeploy`, itself shipped as an AppImage, which needs
      # FUSE to mount itself -- `libfuse2` is not preinstalled on GitHub's
      # Ubuntu runner images (#316: "failed to run linuxdeploy" without it).
      - name: Install Tauri's Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libfuse2 \
            patchelf

      - name: Cache cargo registry and the src-tauri target directory
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            apps/desktop/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # The server's own compile step (#316) plus session-host's pre-existing
      # one (#92) are this bundle's two sidecars; `stage-sidecars.mjs`
      # co-locates them the way #308's S2 spike found necessary (server as
      # `externalBin`, session-host + its native addons as `resources`)
      # before `cargo tauri build` ever runs.
      - name: Compile the server and session-host sidecars
        run: |
          bunx turbo run compile --filter=@plotroom/server --filter=@plotroom/session-host

      # `stage-sidecars.mjs` also copies `apps/web/dist` into
      # `resources/web-dist/` (threaded to the spawned server as
      # `PLOTROOM_STATIC_DIR`, see the script's own comment) and throws if
      # it is missing -- the renderer needs building here too, not only the
      # two sidecars above.
      - name: Build the web renderer
        run: bunx turbo run build --filter=@plotroom/web

      # `APPIMAGE_EXTRACT_AND_RUN=1`: `linuxdeploy` (which the appimage
      # bundle target runs) is itself shipped as an AppImage, and even with
      # `libfuse2` installed, actually mounting via FUSE inside GitHub's
      # container still failed ("failed to run linuxdeploy") -- this makes
      # every AppImage tool in the chain extract-and-run instead of
      # FUSE-mounting itself, sidestepping the kernel/container-permission
      # gap rather than only the missing userspace library.
      #
      # `NO_STRIP=true`: with that fixed, linuxdeploy still failed the same
      # way -- verbose logs (tauri-apps/tauri#14796, an open upstream issue)
      # show its `strip` call chokes on modern ELF `.relr.dyn` sections that
      # ubuntu-latest's (24.04, "noble") system libraries carry; skipping
      # strip is the maintainer-confirmed workaround.
      - name: Build the desktop bundle
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
        run: bun run --filter=@plotroom/desktop build

      # The updater dry-run this job's acceptance criteria names: not a real
      # release, a placeholder/local static host per #309's ADR §6 (hosting
      # and signing explicitly deferred) — `tests/updater_dry_run.rs` starts
      # its own local HTTP server standing in for that placeholder host and
      # proves the plugin's `check()` round-trips against it. Already run by
      # `bun run --filter=@plotroom/desktop test` above (`cargo test`), so
      # this step exists to name the acceptance criterion in the job log
      # rather than to run anything new.
      - name: Updater dry-run against a placeholder host
        run: cd apps/desktop/src-tauri && cargo test --test updater_dry_run

      # #317's native shell suite: window lifecycle, sidecar spawn ->
      # single-instance/attach, canvas-visible + wheel-zoom smoke, and a
      # best-effort close, driven over `@wdio/tauri-service`'s embedded
      # WebDriver provider against a *debug* build (the embedded driver
      # plugin only registers behind `#[cfg(debug_assertions)]`, see
      # `src-tauri/src/lib.rs`) -- reusing the sidecars/renderer this job
      # already staged and built above.
      - name: Build the debug binary for the native shell suite
        run: bun run --filter=@plotroom/desktop e2e:build

      # WebKitGTK needs a real X display even for the embedded provider;
      # GitHub's Linux runner has none by default.
      - name: Install Xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      # #359: only these two native-shell-suite steps are non-blocking --
      # everything above (sidecar staging, `cargo tauri build`, the bundle,
      # the updater dry-run) stays blocking, because that is #316's proven,
      # stable acceptance and this change must not weaken it. The suite
      # itself is new (#317) and has already shown CI-only flakiness on this
      # exact row (`Tauri core.invoke not available after 5s timeout`, a
      # stale element reference, then ECONNRESET/ECONNREFUSED against the
      # embedded WebDriver on 127.0.0.1:4445 -- see the run linked from #359,
      # where the immediately preceding two runs of this same row passed).
      # `continue-on-error: true` on the step (not the job) is deliberate: a
      # failure here still fails only this step, so it still runs, still
      # shows red in the job log, and does not mask a real failure in the
      # build/bundle/updater steps around it. Promotion bar, recorded on
      # #359: 10 consecutive green nightly runs. Remove these two lines once
      # that bar is met and #359 is resolved.
      - name: Native shell suite (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: xvfb-run -a bun run --filter=@plotroom/desktop e2e

      # Same reasoning as the Linux step above (#359).
      - name: Native shell suite
        if: runner.os != 'Linux'
        continue-on-error: true
        run: bun run --filter=@plotroom/desktop e2e
