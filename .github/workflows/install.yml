name: Install

# A full `bun install --frozen-lockfile` on every OS `@plotroom/db` ships to, plus
# that package's own suite run on each of them under `bun:sqlite` (#313), plus
# #312's FTS5 platform gate.
#
# Its own workflow with its own trigger filter, because unlike every other job this
# one's surface really is a list of files: the lockfile, a manifest, `bunfig.toml`,
# the workspace definition, this workflow itself, or `packages/db` — and nothing
# else in the repository can change its answer. A path filter here costs zero
# runner minutes on the changes that cannot affect it, where a job gated on the
# dependency graph (see `ci.yml`) would still have to start a runner to be told the
# graph is irrelevant.
#
# The tradeoff of filtering at the trigger: a workflow that never starts reports
# neither success nor failure, so this cannot be a required check under branch
# protection. `ci.yml`'s jobs can, because they are gated per job rather than per
# trigger.
#
# ## History: why this workflow exists, and why its Windows job changed shape twice
#
# It began (#183) as a full `bun install --frozen-lockfile` **with scripts** on
# Windows, because `better-sqlite3` carried a `binding.gyp` at its package root and
# Bun ran the default `install: node-gyp rebuild` for it even though it shipped an
# N-API prebuild per platform and needed no compiler — and node-gyp 10.2.0 did not
# recognise the Visual Studio the runner image shipped. The fix was
# `trustedDependencies`, and this job was what kept it fixed.
#
# That job's first shape ran `@plotroom/db`'s suite directly and it failed — for
# reasons that had nothing to do with installing: 21 of its tests tore down with
# `EBUSY: resource busy or locked, unlink ...\plotroom.db`, because Windows refuses
# to delete a file that still has an open handle and `afterEach` removed the state
# directory straight after `close()`. Filed as #202. Running the suite there would
# have made that job's red mean two unrelated things, so it was narrowed to a
# round trip through the compiled binding instead — install, then load and query
# `better-sqlite3` directly, asserting the *prebuild* loaded rather than a
# freshly-compiled `.node`.
#
# #313 replaced that driver with `bun:sqlite` (no native binding, no
# `binding.gyp`, nothing to compile), which retires the binding round trip and
# reopens the original question `better-sqlite3` blocked: does the suite actually
# pass on Windows? `db-suite` below is that answer, run fresh on all three OSes
# rather than assumed from Linux — see #202 for the recorded result and whether
# the swap moots the EBUSY finding outright (a Windows-only WAL/journal handle a
# different driver holds differently) or merely changes which driver would need
# the retry.
#
# `fts5-platform-gate` (#312) lives in this workflow for the same reason
# `db-suite` does: it is not a function of the dependency graph `ci.yml`'s
# `--affected` scoping reads, it is a function of *which OS*. Bun's own docs make
# no promise about FTS5 or which SQLite compile flags its bundled build carries,
# and Linux/Windows (Bun's static SQLite) vs. macOS (Apple's system SQLite) makes
# platform variance plausible, not hypothetical. It is the gate in front of #313
# (bun:sqlite as the single driver): the probe
# (`packages/db/bun-probes/fts5-platform.test.ts`) creates an `fts5` virtual table
# shaped exactly like `packages/db/src/search.ts`'s, exercises `MATCH`,
# `snippet()`, and weighted `bm25()`, and checks
# `sqlite_compileoption_used('ENABLE_FTS5')` — under `bun test`, not vitest,
# because it imports `bun:sqlite` directly (see the probe file's own header for
# why it is not under `src/`). This job did not pre-decide a fallback: if a
# platform had failed, #312's own fallback (`Database.setCustomSQLite()` with a
# shipped SQLite library) would have been implemented on the same branch and this
# job re-run, not skipped. See #309 for the addendum recording the measured
# per-OS result.

on:
  push:
    branches: [main]
    # One list, aliased below — the classification must not drift between the two
    # triggers. `**/package.json` covers the root manifest and every package's.
    paths: &manifests
      - "**/package.json"
      - "bun.lock"
      - "package.json"
      - "bunfig.toml"
      - ".github/workflows/install.yml"
      - ".github/actions/setup/action.yml"
      # `@plotroom/db`'s own suite and its bun:sqlite driver: this workflow's
      # `db-suite` job runs on a change to either.
      - "packages/db/src/**"
      - "packages/db/package.json"
      # The FTS5 gate's own surface: the probe itself, and the two
      # `packages/db` source files whose shape it measures against (the
      # `search` virtual table's schema in `migrations.ts`, and the query
      # surface in `search.ts`) are already covered by `packages/db/src/**`
      # above; the probe directory is not.
      - "packages/db/bun-probes/**"
  pull_request:
    paths: *manifests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # #313: `@plotroom/db`'s own suite (unit, migration, and search tests all live
  # under `src/`, run together as one `bun test`), fresh on every OS it ships to.
  # This is what answers #202 rather than assumes it: `better-sqlite3` is gone, so
  # nothing here compiles, and the only way to know whether the EBUSY teardown
  # finding follows the old driver or the state directory's Windows semantics is
  # to run the same suite against the new one.
  db-suite:
    name: "@plotroom/db suite (${{ matrix.os }})"
    strategy:
      # One OS's suite failing is itself the signal #202 needs — a fail-fast run
      # would hide the other two platforms' results behind it.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          turbo-cache: db-suite

      # `@plotroom/db` resolves `@plotroom/core` through its `default` export
      # condition (`./dist/index.js`), which only `bun run test` inside
      # `packages/db` does not produce on its own: that condition is for a
      # consumer, not for turbo's own `dependsOn: ["^build"]` graph, and
      # `bun run test` here runs outside turbo entirely. Build the one
      # workspace dependency `@plotroom/db` actually has before testing it.
      - name: Build @plotroom/core
        run: bunx turbo run build --filter=@plotroom/core

      - name: Run the db suite under the pinned Bun
        working-directory: packages/db
        run: bun run test

  # #312's FTS5 platform gate. Bun's docs promise nothing about FTS5, so this
  # measures it directly on all three OSes rather than assuming Linux's result
  # generalizes — Bun links its own static SQLite on Linux and Windows, but the
  # system-provided libsqlite3 on macOS, which is exactly the axis a compile-flag
  # regression would hide on.
  fts5-platform-gate:
    name: FTS5 platform gate (${{ matrix.os }})
    strategy:
      # One OS's probe failing is the signal this job exists to produce — a
      # fail-fast run would hide the other two platforms' results behind it, and
      # the whole point is the per-OS matrix, not the first red.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # No turbo cache: the probe has no build step and no dependency on
      # `packages/db`'s own compiled output, only on the Bun runtime's `bun:sqlite`
      # and `bun:test` — the same pinned Bun version (1.3.14) every other job uses.
      - uses: ./.github/actions/setup

      - name: Run the FTS5 probe under the pinned Bun
        working-directory: packages/db
        run: bun run probe:fts5
