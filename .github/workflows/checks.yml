name: Checks

# The checks that apply to *every* change, including a documentation-only one:
# formatting (Prettier formats Markdown, so this is the check a docs change can
# actually fail), the commit messages, the shape of the history, and the subject
# that will become the permanent record.
#
# `ci.yml` holds the code checks and is path-filtered off documentation. The split
# is by workflow rather than by job because GitHub's `paths-ignore` is a trigger
# filter, not a per-job one: one filtered workflow would have skipped these too.
#
# Nothing here needs a build, a browser or Bun, so it stays cheap enough to run
# unconditionally — but it is two jobs and two installs rather than the four it was.
# The three history checks share one checkout because they read the same commit
# range, and a runner spent on a `bun install` to run one `git rev-list` is a
# runner wasted.

on:
  push:
    branches: [main]
  # `edited` matters: the pull-request title is the subject a squash merge writes, and
  # it is the one input to these checks that changes without touching the branch. The
  # default activity types are opened/synchronize/reopened, so without this a title
  # renamed after a green run is never re-linted.
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    # Retitling a pull request cannot change how a file is formatted. Only the
    # squash subject below has to be re-checked on `edited`.
    if: github.event.action != 'edited'
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Format
        run: bun format:check

  # The branch's commits, the history's shape, and the subject the squash will
  # write. One job because all three read the same commit range from the same
  # checkout, and two of the three need commitlint installed.
  commits:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Commitlint
        if: github.event.action != 'edited'
        run: >-
          bun commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

      - name: Reject merge commits
        if: github.event.action != 'edited'
        run: |
          merges=$(git rev-list --merges \
            ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }})
          if [ -n "$merges" ]; then
            echo "merge commits are not allowed (see AGENTS.md):"
            echo "$merges"
            exit 1
          fi

      # The message a squash merge writes is the permanent record, and until this
      # step existed nothing checked its subject: `Commitlint` above lints the
      # branch's own commits, which the squash replaces.
      #
      # The two halves have different sources, so they are checked in different
      # places. The **subject** is `squash_merge_commit_title: PR_TITLE` — this pull
      # request's title with ` (#N)` appended — which is what this lints, suffix
      # included, because the suffix counts against `header-max-length`. The **body**
      # is `squash_merge_commit_message: COMMIT_MESSAGES`, i.e. the branch's own
      # commit messages, which the step above has already linted line for line. That
      # setting was `PR_BODY` until #220, and a pull-request body is prose with links
      # and long lines in it: #220's own body fails `body-max-line-length` on
      # thirteen lines.
      #
      # It matters beyond tidiness: `bun release` refuses any commit range
      # containing a commit commitlint rejects, so one bad squash message would break
      # every later release, and whoever is cutting it would be the one to find out.
      # A `--subject` override is not linted by anything — that is the deviation, and
      # it is on whoever passes it.
      #
      # The title goes through the environment rather than into the command line: it
      # is attacker-controlled text on a fork's pull request, and `${{ }}`
      # interpolation into a `run:` block is a shell injection.
      - name: Commitlint the squash subject
        env:
          SUBJECT: ${{ github.event.pull_request.title }} (#${{ github.event.pull_request.number }})
        run: printf '%s' "$SUBJECT" | bun commitlint --verbose
