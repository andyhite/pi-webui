# Packaging config (spec §12, AGENTS.md's "electron-builder with
# electron-updater" decision, Epic 8.4).
#
# `extraResources` copies `scripts/stage-resources.mjs`'s output
# (`build/resources/{server,web}`, gitignored, regenerated by
# `pnpm package`) into the packaged app's `resources/` directory, deliberately
# preserving the same *relative* sibling layout dev already assumes:
#
#   dev:      apps/desktop/dist/main.js -> ../../server/dist/index.js
#             apps/server/dist/config.js -> ../../web/dist
#   packaged: resources/app.asar/dist/main.js -> ../../server/dist/index.js
#             resolves to resources/server/dist/index.js
#             resources/server/dist/config.js -> ../../web/dist
#             resolves to resources/web/dist
#
# So `main.ts`'s `SERVER_ENTRY` and `apps/server/src/config.ts`'s
# `defaultStaticDir()` need no packaged-vs-dev branch — see
# `docs/deployment.md` for the full picture and how this was verified.
#
# `publish` is deliberately unset: the actual update-feed host and
# code-signing posture are open decisions (AGENTS.md), not made by this
# config. Without a publish target, `electron-updater`'s checks fail
# gracefully (`updater.ts`'s `checkForUpdatesNow` logs and continues) rather
# than crashing — the mechanism is wired, the hosting decision is not.
appId: com.plotroom.desktop
productName: PlotRoom
executableName: plotroom
copyright: "PlotRoom"
directories:
  output: dist-installers
files:
  - dist/**
  - package.json
  - "!dist/**/*.test.js"
  - "!dist/**/*.test.js.map"
  - "!dist/**/*.test.d.ts"
  - "!dist/**/*.test.d.ts.map"
extraResources:
  # electron-builder's file copier hard-codes excluding any top-level
  # directory whose path *relative to that matcher's own `from`* is
  # exactly "node_modules" (`app-builder-lib`'s `util/filter.js`,
  # `createFilter`: "filter the root node_modules, but not a
  # sub node_modules") — unconditional, no `filter:` override bypasses it.
  # Verified directly: with a single `server` entry above, the packaged
  # app's `resources/server/node_modules` came out empty and the spawned
  # server failed to boot with `ERR_MODULE_NOT_FOUND`. Pointing a *second*
  # entry's `from` directly **at** the `node_modules` directory makes it
  # the matcher's own root instead of a child (`createFilter`'s `src ===
  # file` check returns true before the name check ever runs), so this
  # split is required, not stylistic.
  - from: build/resources/server
    to: server
    filter:
      - "**/*"
      - "!node_modules"
  - from: build/resources/server/node_modules
    to: server/node_modules
    filter:
      - "**/*"
  - from: build/resources/web
    to: web
    filter:
      - "**/*"
linux:
  target:
    - AppImage
    - deb
  category: Development
  maintainer: PlotRoom
  # electron-builder's deb target defaults an artifact path off the
  # package.json "name" field, which is scoped ("@plotroom/desktop") and
  # produces a literal "/" in the output filename — this pins a flat name
  # instead, matching AppImage's own default naming.
  artifactName: "${productName}-${version}.${ext}"
mac:
  target:
    - dmg
  category: public.app-category.developer-tools
win:
  target:
    - nsis
publish: null
