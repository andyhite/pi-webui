<!doctype html>
<!--
  A desktop-owned surface (spec §12, Epic 3.0's carry-over), never part of
  `apps/web`'s renderer — this page never loads over `/`, only inside its
  own BrowserWindow, and talks to `main.ts` over the narrow bridge
  `backend-picker-preload.ts` exposes. No canvas, no graph, no `@plotroom/ui`
  import: switching backends is a decision about *which* PlotRoom this
  window looks at, made before there is a graph to show.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>PlotRoom — Backends</title>
    <style>
      body {
        font:
          13px -apple-system,
          system-ui,
          sans-serif;
        margin: 16px;
        color: #1a1a1a;
      }
      h1 {
        font-size: 15px;
      }
      ul {
        list-style: none;
        padding: 0;
      }
      li {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 0;
        border-bottom: 1px solid #ddd;
      }
      li .label {
        flex: 1;
      }
      li .url {
        color: #666;
        font-size: 12px;
      }
      form {
        margin-top: 16px;
        display: grid;
        gap: 6px;
      }
      input {
        padding: 4px 6px;
      }
      #status {
        min-height: 1.2em;
        color: #a33;
      }
      button.active {
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>Backends</h1>
    <p>
      <strong id="current-label">Local</strong> is the active backend. When the
      active backend is remote, workspaces, diffs, and file browsing refer to
      <em>that</em> machine, not this one (spec §12).
    </p>
    <ul id="backend-list"></ul>
    <p><button id="use-local">Use local (spawn-or-attach)</button></p>

    <h1>Remember a remote backend</h1>
    <form id="add-form">
      <label>Label <input id="label" required /></label>
      <label>URL (e.g. https://host:port) <input id="url" required /></label>
      <label
        >Operator credential (optional) <input id="credential" type="password"
      /></label>
      <button type="submit">Test connection and remember</button>
      <div id="status"></div>
    </form>

    <script src="./backend-picker.js"></script>
  </body>
</html>
